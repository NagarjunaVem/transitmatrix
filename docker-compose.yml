version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: transitmatrix_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: transitmatrix
      MYSQL_USER: transit_user
      MYSQL_PASSWORD: transit_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/05_procedures.sql
      - ./database/security.sql:/docker-entrypoint-initdb.d/06_security.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/07_seed.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transitmatrix_backend
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: transitmatrix
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      MYSQL_POOL_SIZE: 10
      SECRET_KEY: change_this_to_a_super_secret_jwt_key_at_least_32_chars_long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
